[project]
name = "marvin-integration-mastodon"
version = "0.4.0"
description = "Mastodon integration for Marvin — post a status through social.post, and read mentions and reply, favourite, boost, message or delete your own replies through the shared social engagement capabilities."
readme = "README.md"
requires-python = ">=3.11"
# 0.15: `playbook_blueprint` — the integration ships a Playbook.
dependencies = ["marvin-integration-sdk>=0.15,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]

# This is the seam that makes the plugin discoverable: an installed Marvin scans this group at
# startup and registers whatever providers it finds. No core or frontend changes needed.
[project.entry-points."marvin.integrations"]
mastodon = "marvin_integration_mastodon:MastodonProvider"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marvin_integration_mastodon"]

# Dev only: resolve the SDK from the sibling checkout. Released builds take it from the index.
[tool.uv.sources]
marvin-integration-sdk = { path = "../MarvinIntegrationSDK", editable = true }

[tool.ruff]
line-length = 150
target-version = "py311"
